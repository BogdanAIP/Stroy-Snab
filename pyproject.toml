[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stroy-snab"
version = "0.1.0"
description = "Evidence-driven construction procurement domain tooling"
requires-python = ">=3.11"
dependencies = [
  "XlsxWriter>=3.2.9,<4",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "openpyxl>=3.1.5,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
